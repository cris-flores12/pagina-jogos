<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius - GameSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← Voltar ao Menu</a>
        <h2>🧠 Jogo Genius</h2>
        
        <div class="mode-selection">
            <button id="btn-solo" class="mode-btn active">Solo</button>
            <button id="btn-multi" class="mode-btn">Multiplayer</button>
        </div>

        <div class="name-registration">
            <input type="text" id="player-name" placeholder="Nome para o Ranking" maxlength="12">
        </div>

        <div class="scoreboard">
            <div class="score-box">Rodada: <span id="current-round">0</span></div>
            <div class="score-box">Melhor: <span id="high-score">0</span></div>
        </div>

        <div class="genius-board">
            <div class="genius-btn green" data-color="green"></div>
            <div class="genius-btn red" data-color="red"></div>
            <div class="genius-btn yellow" data-color="yellow"></div>
            <div class="genius-btn blue" data-color="blue"></div>
            <div class="center-circle"><button id="start-btn">Jogar</button></div>
        </div>

        <div id="msg-display" class="message">Clique em Jogar para iniciar</div>
        
        <div class="ranking-section">
            <h3>🏆 Top 5 Recordes</h3>
            <div id="genius-ranking-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
