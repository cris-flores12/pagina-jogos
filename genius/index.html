<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius | GameZone JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <a href="../index.html" class="btn-back">&larr; Voltar</a>
            <h1>Genius</h1>
            <div class="score-board">
                <p>Rodada: <span id="score">0</span></p>
                <p>Recorde: <span id="high-score">0</span></p>
            </div>
        </header>

        <div id="message-area" class="message-area">
            Clique em "Iniciar" para começar!
        </div>

        <div class="genius-board">
            <div class="color-btn green" data-color="0"></div>
            <div class="color-btn red" data-color="1"></div>
            <div class="color-btn yellow" data-color="2"></div>
            <div class="color-btn blue" data-color="3"></div>
            
            <div class="center-circle">
                <button id="btn-start" class="btn-start">INICIAR</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
