<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← Voltar ao Menu</a>
        <h2>❌⭕ Jogo da Velha</h2>

        <div class="mode-selection">
            <button id="btn-solo" class="mode-btn active">Solo (vs CPU)</button>
            <button id="btn-multi" class="mode-btn">2 Jogadores</button>
        </div>

        <div class="name-registration">
            <input type="text" id="player-name" placeholder="Nome para o Ranking" maxlength="12">
        </div>

        <div class="status" id="status-text">Turno de: X</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="reset-btn">Reiniciar Partida</button>

        <div class="ranking-section">
            <h3>🏆 Histórico de Partidas</h3>
            <div id="velha-ranking-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
